@version: 4.2
@include "scl.conf"
# f_device_networks, from DEVICE_NETWORKS of .env (scripts/generate_device_networks.sh)
@include "/config/device_networks.conf"

options {
    keep-hostname(yes);
};

source s_network {
    udp(ip("0.0.0.0") port(1514));
    tcp(ip("0.0.0.0") port(1514));
};

destination d_debug {
    file(
        "/var/log/debug.log"
        template("FULLHOST='${FULLHOST}' FULLHOST_FROM='${FULLHOST_FROM}' HOST='${HOST}' HOST_FROM='${HOST_FROM}' SOURCE='${SOURCE}' SOURCEIP='${SOURCEIP}' | ${RAWMSG}")
    );
};

destination d_host_logs {
    file(
        "/var/log/Hosts/${HOST}/${HOST}.log"
        create-dirs(yes)
        dir-owner(1000)
        dir-group(1000)
        dir-perm(0755)
        owner(1000)
        group(1000)
        perm(0644)
    );
};

log {
    source(s_network);
    filter(f_device_networks);
    destination(d_host_logs);
    destination(d_debug);
};

