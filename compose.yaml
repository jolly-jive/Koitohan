services:

  openldap:
    image: osixia/openldap:1.5.0
    container_name: ${OPENLDAP_CONTAINER_NAME}
    environment:
      TZ: "${TZ}"
      LDAP_ORGANISATION: "${LDAP_ORGANISATION}"
      LDAP_DOMAIN: "${LDAP_DOMAIN}"
      # The image sets these passwords again on every start. Do not run
      # it with --loglevel debug: it would log what it reads here.
      LDAP_ADMIN_PASSWORD_FILE: /run/secrets/ldap_admin_password
      LDAP_CONFIG_PASSWORD_FILE: /run/secrets/ldap_config_password
      LDAP_LOG_LEVEL: "256"
      LDAP_TLS: "true"
      # refuses anything without TLS on 389. The image keeps this on once
      # it has been set, until openldap/config is deleted.
      LDAP_TLS_ENFORCE: "true"
      LDAP_READONLY_USER: "false"
      LDAP_ENABLE_MEMBEROF: "true"
      LDAP_ENABLE_REFERRALS: "false"
      LDAP_SEED_INTERNAL_LDIF_PATH: /root/ldif
      # the seed is copied on every start, so its destination has to stay
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ./openldap/data:/var/lib/ldap
      - ./openldap/config:/etc/ldap/slapd.d
      - ./CA/default-ca.pem:/container/service/slapd/assets/certs/ca.crt
      - ./CA/openldap_server.crt:/container/service/slapd/assets/certs/ldap.crt
      - ./CA/openldap_server.key:/container/service/slapd/assets/certs/ldap.key
      - ./CA/dhparam.pem:/container/service/slapd/assets/certs/dhparam.pem
      - ./openldap/ldif:/root/ldif:ro
      - ./secrets/ldap_admin_password:/run/secrets/ldap_admin_password:ro
      - ./secrets/ldap_config_password:/run/secrets/ldap_config_password:ro
    ports:
#      - "389:389"
      - "636:636"
    networks:
      - default
      - openssh
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  freeradius:
    image: cayenneryo/freeradius-server:4.0.40537-devel-ubuntu26-14fdfb3-r1
    container_name: ${FREERADIUS_CONTAINER_NAME}
#    command: ["radiusd", "-X"]
    environment:
      TZ: "${TZ}"
    volumes:
      - ./freeradius/config/clients.conf:/etc/freeradius/clients.conf:ro
      - ./freeradius/config/dictionary.d:/etc/freeradius/dictionary.d:ro
      - ./freeradius/config/mods-available/detail.log:/etc/freeradius/mods-available/detail.log:ro
      - ./freeradius/config/mods-available/ldap_openldap:/etc/freeradius/mods-available/ldap_openldap:ro
      - ./freeradius/config/mods-enabled:/etc/freeradius/mods-enabled:ro
      - ./freeradius/config/policy.d/authz_vendor_role:/etc/freeradius/policy.d/authz_vendor_role:ro
      - ./freeradius/config/sites-available/ldap-pap:/etc/freeradius/sites-available/ldap-pap:ro
      - ./freeradius/config/sites-enabled:/etc/freeradius/sites-enabled:ro
      - ./freeradius/log:/var/log/freeradius
      - ./CA/default-ca.pem:/etc/freeradius/certs/ca.crt:ro
      - ./CA/freeradius_client.crt:/etc/freeradius/certs/client.crt:ro
      - ./CA/freeradius_client.key:/etc/freeradius/certs/client.key:ro
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    depends_on:
      - openldap
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  syslog-ng:
    image: lscr.io/linuxserver/syslog-ng:4.11.0-r0-ls205
    container_name: ${SYSLOG_CONTAINER_NAME}
    #read_only: true
    #user: 1000:1000
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - LOG_TO_STDOUT= #optional
    volumes:
      - ./syslog-ng/config:/config
      - ./syslog-ng/log:/var/log # better on NVMe
    ports:
      - 514:1514/udp
      - 514:1514/tcp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  tftpd-hpa:
    build: ./tftpd-hpa/build
    image: koitohan/tftpd-hpa
    container_name: ${TFTP_CONTAINER_NAME}
    environment:
      TZ: "${TZ}"
    volumes:
      - ./tftpd-hpa/tftpboot/firmware:/tftpboot/firmware:ro
      - ./tftpd-hpa/tftpboot/configs:/tftpboot/configs
    ports:
      - "69:69/udp"
    ulimits:
      fsize: ${TFTP_UPLOAD_MAX_BYTES}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  openssh:
    build: ./openssh/build
    image: koitohan/openssh
    container_name: ${OPENSSH_CONTAINER_NAME}
    # shown in the prompt, so that the users see which server they are on
    hostname: ${OPENSSH_HOSTNAME}
    # reaps the processes that the users leave behind
    init: true
    read_only: true
    environment:
      TZ: "${TZ}"
      LDAP_URI: "ldaps://${OPENLDAP_CONTAINER_NAME}"
      LDAP_DOMAIN: "${LDAP_DOMAIN}"
      SERVICE_ACCOUNT_NAME: "${OPENSSH_SERVICE_ACCOUNT_NAME}"
      PASSWDQC_MIN: "${PASSWDQC_MIN}"
    volumes:
      - ./CA/default-ca.pem:/etc/koitohan/certs/ca.crt:ro
      - ./CA/openssh_client.crt:/etc/koitohan/certs/client.crt:ro
      - ./CA/openssh_client.key:/etc/koitohan/certs/client.key:ro
      - ./openssh/hostkeys:/etc/koitohan/hostkeys:ro
      - ./secrets/openssh_service_account_password:/etc/koitohan/secrets/bindpw:ro
      - ./syslog-ng/log/Hosts:/logs/Hosts:ro
      - ./tftpd-hpa/tftpboot/configs:/tftpboot/configs
      - ./tftpd-hpa/tftpboot/firmware:/tftpboot/firmware
    tmpfs:
      - /run:mode=755,size=1m
      # the only place the users can write to. Counts against mem_limit,
      # so keep it well below.
      - /tmp:mode=1777,size=32m
    ports:
      - "${OPENSSH_PORT}:22"
    # reaches OpenLDAP only, not the other services
    networks:
      - openssh
    depends_on:
      - openldap
    # mem_limit needs the memory controller of cgroup on the Docker host
    pids_limit: 256
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}
  openssh:
    ipam:
      config:
        - subnet: ${OPENSSH_SUBNET}
