# Every port is published on IPv4 only (0.0.0.0). Without the address,
# Docker listens on IPv6 as well and relays what arrives there, and the
# containers see it as coming from the gateway of the bridge, a private
# address. That would pass the limit on the source in FreeRADIUS.

services:

  openldap:
    build: ./openldap/build
    image: koitohan/openldap
    container_name: ${OPENLDAP_CONTAINER_NAME}
    read_only: true
    environment:
      TZ: "${TZ}"
      LDAP_ORGANISATION: "${LDAP_ORGANISATION}"
      LDAP_DOMAIN: "${LDAP_DOMAIN}"
      LDAP_LOG_LEVEL: "stats"
    volumes:
      - ./openldap/data:/var/lib/openldap/openldap-data
      - ./openldap/config:/etc/openldap/slapd.d
      - ./CA/default-ca.pem:/etc/koitohan/certs/ca.crt:ro
      - ./CA/openldap_server.crt:/etc/koitohan/certs/ldap.crt:ro
      - ./CA/openldap_server.key:/etc/koitohan/certs/ldap.key:ro
      # loaded once, when the directory is empty
      - ./openldap/ldif:/etc/koitohan/ldif:ro
      # set again on every start
      - ./secrets/ldap_admin_password:/etc/koitohan/secrets/ldap_admin_password:ro
      - ./secrets/ldap_config_password:/etc/koitohan/secrets/ldap_config_password:ro
    tmpfs:
      - /run:mode=755,size=1m
      # the socket of ldapi:///
      - /var/lib/openldap/run:mode=755,size=1m
    ports:
      - "0.0.0.0:636:636"
    networks:
      - default
      - openssh
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  freeradius:
    build: ./freeradius/build
    image: koitohan/freeradius
    container_name: ${FREERADIUS_CONTAINER_NAME}
#    command: ["radiusd", "-X"]
    environment:
      TZ: "${TZ}"
      DEVICE_NETWORKS: "${DEVICE_NETWORKS}"
    volumes:
      - ./freeradius/config/clients.conf:/etc/freeradius/clients.conf:ro
      - ./freeradius/config/dictionary.d:/etc/freeradius/dictionary.d:ro
      - ./freeradius/config/mods-available/detail.log:/etc/freeradius/mods-available/detail.log:ro
      - ./freeradius/config/mods-available/ldap_openldap:/etc/freeradius/mods-available/ldap_openldap:ro
      - ./freeradius/config/mods-enabled:/etc/freeradius/mods-enabled:ro
      - ./freeradius/config/policy.d/authz_vendor_role:/etc/freeradius/policy.d/authz_vendor_role:ro
      - ./freeradius/config/sites-available/ldap-pap:/etc/freeradius/sites-available/ldap-pap:ro
      - ./freeradius/config/sites-enabled:/etc/freeradius/sites-enabled:ro
      - ./freeradius/log:/var/log/freeradius
      - ./CA/default-ca.pem:/etc/freeradius/certs/ca.crt:ro
      - ./CA/freeradius_client.crt:/etc/freeradius/certs/client.crt:ro
      - ./CA/freeradius_client.key:/etc/freeradius/certs/client.key:ro
    ports:
      - "0.0.0.0:1812:1812/udp"
    depends_on:
      - openldap
    # the entrypoint filters the packets by their source, then gives this
    # up before it starts radiusd
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  syslog-ng:
    image: lscr.io/linuxserver/syslog-ng:4.11.0-r0-ls205
    container_name: ${SYSLOG_CONTAINER_NAME}
    #read_only: true
    #user: 1000:1000
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - LOG_TO_STDOUT= #optional
    volumes:
      - ./syslog-ng/config:/config
      - ./syslog-ng/log:/var/log # better on NVMe
    ports:
      - "0.0.0.0:514:1514/udp"
      - "0.0.0.0:514:1514/tcp"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  tftpd-hpa:
    build: ./tftpd-hpa/build
    image: koitohan/tftpd-hpa
    container_name: ${TFTP_CONTAINER_NAME}
    environment:
      TZ: "${TZ}"
      DEVICE_NETWORKS: "${DEVICE_NETWORKS}"
    volumes:
      - ./tftpd-hpa/tftpboot/firmware:/tftpboot/firmware:ro
      - ./tftpd-hpa/tftpboot/configs:/tftpboot/configs
      - ./tftpd-hpa/log:/var/log/tftpd
    ports:
      - "0.0.0.0:69:69/udp"
    ulimits:
      fsize: ${TFTP_UPLOAD_MAX_BYTES}
    # the entrypoint filters the packets by their source, then gives this
    # up before it starts in.tftpd
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  openssh:
    build: ./openssh/build
    image: koitohan/openssh
    container_name: ${OPENSSH_CONTAINER_NAME}
    # shown in the prompt, so that the users see which server they are on
    hostname: ${OPENSSH_HOSTNAME}
    # reaps the processes that the users leave behind
    init: true
    read_only: true
    environment:
      TZ: "${TZ}"
      LDAP_URI: "ldaps://${OPENLDAP_CONTAINER_NAME}"
      LDAP_DOMAIN: "${LDAP_DOMAIN}"
      SERVICE_ACCOUNT_NAME: "${OPENSSH_SERVICE_ACCOUNT_NAME}"
      PASSWDQC_MIN: "${PASSWDQC_MIN}"
      OPENSSH_ALLOWED_NETWORKS: "${OPENSSH_ALLOWED_NETWORKS}"
      OPENSSH_EGRESS: "${OPENSSH_EGRESS}"
    volumes:
      - ./CA/default-ca.pem:/etc/koitohan/certs/ca.crt:ro
      - ./CA/openssh_client.crt:/etc/koitohan/certs/client.crt:ro
      - ./CA/openssh_client.key:/etc/koitohan/certs/client.key:ro
      - ./openssh/hostkeys:/etc/koitohan/hostkeys:ro
      - ./secrets/openssh_service_account_password:/etc/koitohan/secrets/bindpw:ro
      - ./syslog-ng/log/Hosts:/logs/Hosts:ro
      - ./tftpd-hpa/tftpboot/configs:/tftpboot/configs
      - ./tftpd-hpa/tftpboot/firmware:/tftpboot/firmware
    tmpfs:
      - /run:mode=755,size=1m
      # the only place the users can write to. Counts against mem_limit,
      # so keep it well below.
      - /tmp:mode=1777,size=32m
    ports:
      - "0.0.0.0:${OPENSSH_PORT}:22"
    # reaches OpenLDAP only, not the other services
    networks:
      - openssh
    depends_on:
      - openldap
    # mem_limit needs the memory controller of cgroup on the Docker host
    pids_limit: 256
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    # the entrypoint filters the packets by their source and by where they
    # go (OPENSSH_EGRESS), then gives this up before it
    # starts sshd
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # optional: starts only with COMPOSE_PROFILES=ntp in .env
  chrony:
    build: ./chrony/build
    image: koitohan/chrony
    # a default, so that a .env without the variable still works for the
    # stack without this service
    container_name: ${NTP_CONTAINER_NAME:-chrony}
    profiles:
      - ntp
    read_only: true
    environment:
      TZ: "${TZ}"
      DEVICE_NETWORKS: "${DEVICE_NETWORKS}"
    tmpfs:
      - /run:mode=755,size=1m
    ports:
      - "0.0.0.0:123:123/udp"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}
  openssh:
    ipam:
      config:
        - subnet: ${OPENSSH_SUBNET}
