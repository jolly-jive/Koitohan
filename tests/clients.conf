# Clients for the smoke test (tests/smoke.sh), one per reply type.
#
# The test sends its requests from inside the freeradius container. A
# request to 127.0.0.N also leaves from 127.0.0.N, so each address
# selects the client, and with it the nas_type, under test.

client cisco {
	ipaddr = 127.0.0.1
	secret = testing123
	nas_type = cisco
}

client aruba-cx {
	ipaddr = 127.0.0.2
	secret = testing123
	nas_type = aruba-cx
}

client aruba-ap {
	ipaddr = 127.0.0.3
	secret = testing123
	nas_type = Aruba-AP
}

client fortinet {
	ipaddr = 127.0.0.4
	secret = testing123
	nas_type = fortinet
}

client juniper {
	ipaddr = 127.0.0.5
	secret = testing123
	nas_type = juniper
}

client palo-alto {
	ipaddr = 127.0.0.6
	secret = testing123
	nas_type = Palo-Alto
}

client service-type {
	ipaddr = 127.0.0.7
	secret = testing123
	nas_type = Service-Type
}

client ietf-mpl {
	ipaddr = 127.0.0.8
	secret = testing123
	nas_type = ietf-mpl
}

client none {
	ipaddr = 127.0.0.9
	secret = testing123
	nas_type = none
}

client unknown {
	ipaddr = 127.0.0.10
	secret = testing123
	nas_type = bogus
}
