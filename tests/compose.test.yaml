# Overrides compose.yaml for the smoke test (see tests/smoke.sh).
# The test stack runs as a separate project next to the real one. It
# publishes no ports and keeps no data. The certificates come from
# tests/generated, which the test makes for itself.

services:

  openldap:
    container_name: !reset null
    volumes:
      # anonymous volumes take the place of the persistent directories
      - /var/lib/openldap/openldap-data
      - /etc/openldap/slapd.d
      - ./tests/generated/CA/default-ca.pem:/etc/koitohan/certs/ca.crt:ro
      - ./tests/generated/CA/openldap_server.crt:/etc/koitohan/certs/ldap.crt:ro
      - ./tests/generated/CA/openldap_server.key:/etc/koitohan/certs/ldap.key:ro
      - ./tests/generated/CA/openldap_replication.crt:/etc/koitohan/certs/replication.crt:ro
      - ./tests/generated/CA/openldap_replication.key:/etc/koitohan/certs/replication.key:ro
      - ./tests/generated/openldap/peer:/etc/koitohan/peer:ro
      - ./tests/generated/openldap/ldif:/etc/koitohan/ldif:ro
    networks:
      default:
        aliases:
          # ldap_openldap and the server certificate use this name
          - ${OPENLDAP_CONTAINER_NAME}
      openssh:
        aliases:
          - ${OPENLDAP_CONTAINER_NAME}
    ports: !reset []
    restart: "no"

  # The other host of a pair (host B), for the checks of replication. It
  # has the CA of its own that the test makes in tests/generated/peer,
  # and trusts the one of openldap (host A). The addresses are TEST-NET,
  # as in the server certificates; the test sends them on to the
  # containers. Started by name only.
  openldap-b:
    image: koitohan/openldap
    profiles:
      - pair
    read_only: true
    environment:
      TZ: "${TZ}"
      LDAP_ORGANISATION: "${LDAP_ORGANISATION}"
      LDAP_DOMAIN: "${LDAP_DOMAIN}"
      LDAP_LOG_LEVEL: "stats sync"
      OPENLDAP_ALLOWED_NETWORKS: "none"
      OPENLDAP_HOST_ADDRESS: "${KOITOHAN_TEST_B_ADDRESS:-none}"
      OPENLDAP_PEER_ADDRESS: "${KOITOHAN_TEST_A_ADDRESS:-none}"
    volumes:
      - /var/lib/openldap/openldap-data
      - /etc/openldap/slapd.d
      - ./tests/generated/peer/CA/default-ca.pem:/etc/koitohan/certs/ca.crt:ro
      - ./tests/generated/peer/CA/openldap_server.crt:/etc/koitohan/certs/ldap.crt:ro
      - ./tests/generated/peer/CA/openldap_server.key:/etc/koitohan/certs/ldap.key:ro
      - ./tests/generated/peer/CA/openldap_replication.crt:/etc/koitohan/certs/replication.crt:ro
      - ./tests/generated/peer/CA/openldap_replication.key:/etc/koitohan/certs/replication.key:ro
      - ./tests/generated/peer/openldap/peer:/etc/koitohan/peer:ro
      # not read: host B receives its data
      - ./tests/generated/openldap/ldif:/etc/koitohan/ldif:ro
    tmpfs:
      - /run:mode=755,size=1m
      - /var/lib/openldap/run:mode=755,size=1m
    networks:
      - default
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile: 1024
    security_opt:
      - no-new-privileges:true
    restart: "no"

  freeradius:
    container_name: !reset null
    volumes:
      - ./tests/generated/CA/default-ca.pem:/etc/freeradius/certs/ca.crt:ro
      - ./tests/generated/CA/freeradius_client.crt:/etc/freeradius/certs/client.crt:ro
      - ./tests/generated/CA/freeradius_client.key:/etc/freeradius/certs/client.key:ro
      - ./tests/clients.conf:/etc/freeradius/clients.conf:ro
      - ./tests/generated/freeradius/config/mods-available/ldap_openldap:/etc/freeradius/mods-available/ldap_openldap:ro
      # keeps the test out of freeradius/log
      - /var/log/freeradius
    ports: !reset []
    restart: "no"

  syslog-ng:
    container_name: !reset null
    volumes:
      # these keep the test out of syslog-ng/config and syslog-ng/log.
      # The test makes tests/generated/syslog-ng/log/Hosts before the
      # start, as make up does syslog-ng/log/Hosts, and openssh reads it.
      - /config
      - ./tests/generated/syslog-ng/log:/var/log
      - ./syslog-ng/config/syslog-ng.conf:/config/syslog-ng.conf:ro
      - ./tests/generated/syslog-ng/config/device_networks.conf:/config/device_networks.conf:ro
    ports: !reset []
    restart: "no"

  tftpd-hpa:
    container_name: !reset null
    volumes:
      # The test puts the file to fetch into firmware before the start.
      # Read-only as in compose.yaml, which the test checks on its own.
      - ./tests/generated/tftpboot/firmware:/tftpboot/firmware:ro
      # an empty volume, which the test gives the ownership and the mode
      # of configs on the Docker host (docs/tftp.md)
      - /tftpboot/configs
      # keeps the test out of tftpd-hpa/log
      - /var/log/tftpd
    ports: !reset []
    restart: "no"

  openssh:
    container_name: !reset null
    environment:
      # the users of LDAP again every 5 seconds, not 60, for the check
      # "periodic" of smoke.sh
      KOITOHAN_UPDATE_USERS_INTERVAL: 5
    volumes:
      # the logs that syslog-ng of the test stack writes, as in compose.yaml
      - ./tests/generated/syslog-ng/log/Hosts:/logs/Hosts:ro
      # empty volumes with the ownership the image gives these directories
      - /tftpboot/configs
      - /tftpboot/firmware
      - ./tests/sshd_test.conf:/etc/ssh/sshd_config.d/test.conf:ro
      - ./tests/generated/CA/default-ca.pem:/etc/koitohan/certs/ca.crt:ro
      - ./tests/generated/CA/openssh_client.crt:/etc/koitohan/certs/client.crt:ro
      - ./tests/generated/CA/openssh_client.key:/etc/koitohan/certs/client.key:ro
    ports: !reset []
    restart: "no"

  chrony:
    container_name: !reset null
    environment:
      # the limit on maxerror; the test sets 0 to see chrony stop serving
      NTP_MAX_ERROR_US: "${NTP_MAX_ERROR_US:-}"
    ports: !reset []
    restart: "no"

networks:
  default:
    ipam: !reset null
  openssh:
    ipam: !reset null
