# Overrides compose.yaml for the smoke test (see tests/smoke.sh).
# The test stack runs as a separate project next to the real one. It
# publishes no ports and keeps no data. The files that carry the
# passwords of the service accounts and of the administrators of
# OpenLDAP come from tests/generated, which the test makes for itself.

services:

  openldap:
    container_name: !reset null
    volumes:
      # anonymous volumes take the place of the persistent directories
      - /var/lib/openldap/openldap-data
      - /etc/openldap/slapd.d
      - ./tests/generated/openldap/ldif:/etc/koitohan/ldif:ro
      - ./tests/generated/secrets/ldap_admin_password:/etc/koitohan/secrets/ldap_admin_password:ro
      - ./tests/generated/secrets/ldap_config_password:/etc/koitohan/secrets/ldap_config_password:ro
    networks:
      default:
        aliases:
          # ldap_openldap and the server certificate use this name
          - ${OPENLDAP_CONTAINER_NAME}
      openssh:
        aliases:
          - ${OPENLDAP_CONTAINER_NAME}
    ports: !reset []
    restart: "no"

  freeradius:
    container_name: !reset null
    volumes:
      - ./tests/clients.conf:/etc/freeradius/clients.conf:ro
      - ./tests/generated/freeradius/config/mods-available/ldap_openldap:/etc/freeradius/mods-available/ldap_openldap:ro
      - ./tests/generated/freeradius/config/device_networks:/etc/freeradius/device_networks:ro
      # keeps the test out of freeradius/log
      - /var/log/freeradius
    ports: !reset []
    restart: "no"

  syslog-ng:
    container_name: !reset null
    volumes:
      # these keep the test out of syslog-ng/config and syslog-ng/log.
      # An anonymous volume on /var/log would belong to root, and
      # syslog-ng (uid 1000) could not write to it.
      - /config
      - type: tmpfs
        target: /var/log
        tmpfs:
          mode: 0o1777
      - ./syslog-ng/config/syslog-ng.conf:/config/syslog-ng.conf:ro
      - ./tests/generated/syslog-ng/config/device_networks.conf:/config/device_networks.conf:ro
    ports: !reset []
    restart: "no"

  tftpd-hpa:
    container_name: !reset null
    volumes:
      # empty volumes. The test puts the file to fetch into firmware.
      - /tftpboot/firmware
      - /tftpboot/configs
      # keeps the test out of tftpd-hpa/log
      - /var/log/tftpd
    ports: !reset []
    restart: "no"

  openssh:
    container_name: !reset null
    volumes:
      # empty volumes with the ownership the image gives these directories
      - /logs/Hosts
      - /tftpboot/configs
      - /tftpboot/firmware
      - ./tests/sshd_test.conf:/etc/ssh/sshd_config.d/test.conf:ro
      - ./tests/generated/secrets/openssh_service_account_password:/etc/koitohan/secrets/bindpw:ro
    ports: !reset []
    restart: "no"

networks:
  default:
    ipam: !reset null
  openssh:
    ipam: !reset null
